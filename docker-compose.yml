services:
  postgres:
    image: postgres:16-alpine
    container_name: kor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: kingdoms_of_ruin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kingdoms_of_ruin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kingdoms-of-ruin-backend:latest
    container_name: kor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://postgres:123@postgres:5432/kingdoms_of_ruin?sslmode=disable"
    ports:
      - "8088:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kingdoms-of-ruin-frontend:latest
    container_name: kor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
